<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টু-ডু অ্যাপ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .app {
            background: #fff;
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .app h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .input-area button:hover {
            background: #5a6fd6;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filters button {
            padding: 6px 15px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .filters button.active,
        .filters button:hover {
            background: #667eea;
            color: white;
        }

        ul#taskList {
            list-style: none;
        }

        ul#taskList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: #f7f7fb;
            border-radius: 8px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ul#taskList li .task-text {
            flex: 1;
            cursor: pointer;
            margin-left: 10px;
            word-break: break-word;
        }

        ul#taskList li.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }

        ul#taskList li input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        ul#taskList li .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        ul#taskList li .delete-btn:hover {
            background: #c0392b;
        }

        .empty-msg {
            text-align: center;
            color: #999;
            padding: 20px 0;
        }

        .stats {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="app">
        <h1>📋 আমার টু-ডু</h1>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="নতুন কাজ লিখুন..." />
            <button onclick="addTask()">যোগ</button>
        </div>

        <div class="filters">
            <button class="active" onclick="setFilter('all', this)">সব</button>
            <button onclick="setFilter('active', this)">চলমান</button>
            <button onclick="setFilter('completed', this)">সম্পন্ন</button>
        </div>

        <ul id="taskList"></ul>
        <div class="stats" id="stats"></div>
    </div>

    <script>
        // ---- ডেটা ম্যানেজমেন্ট ----
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';

        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const stats = document.getElementById('stats');

        // ---- সেভ ----
        function save() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // ---- কাজ যোগ ----
        function addTask() {
            const text = taskInput.value.trim();
            if (!text) {
                alert('দয়া করে কিছু লিখুন!');
                return;
            }
            tasks.push({ id: Date.now(), text, completed: false });
            taskInput.value = '';
            save();
            render();
        }

        // এন্টার চাপলে যোগ হবে
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // ---- টগল (সম্পন্ন/চলমান) ----
        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            save();
            render();
        }

        // ---- ডিলিট ----
        function deleteTask(id) {
            if (!confirm('এই কাজটি মুছে ফেলবেন?')) return;
            tasks = tasks.filter(t => t.id !== id);
            save();
            render();
        }

        // ---- ফিল্টার ----
        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        // ---- রেন্ডার ----
        function render() {
            taskList.innerHTML = '';

            let filtered = tasks;
            if (currentFilter === 'active') filtered = tasks.filter(t => !t.completed);
            if (currentFilter === 'completed') filtered = tasks.filter(t => t.completed);

            if (filtered.length === 0) {
                taskList.innerHTML = '<p class="empty-msg">কোনো কাজ নেই 🎉</p>';
            }

            filtered.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');

                li.innerHTML = `
                    <input type="checkbox" ${task.completed ? 'checked' : ''} />
                    <span class="task-text">${escapeHTML(task.text)}</span>
                    <button class="delete-btn">মুছুন</button>
                `;

                li.querySelector('input').addEventListener('change', () => toggleTask(task.id));
                li.querySelector('.task-text').addEventListener('click', () => toggleTask(task.id));
                li.querySelector('.delete-btn').addEventListener('click', () => deleteTask(task.id));

                taskList.appendChild(li);
            });

            // স্ট্যাটস
            const done = tasks.filter(t => t.completed).length;
            stats.textContent = `মোট: ${tasks.length} | সম্পন্ন: ${done} | বাকি: ${tasks.length - done}`;
        }

        // XSS থেকে সুরক্ষা
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---- শুরু ----
        render();
    </script>

</body>
</html>
