<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 চার্ট</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f4f6fb; --card: #fff; --text: #333; --text-muted: #777; --primary: #1e3c72; --primary-2: #2a5298; --border: #e0e6f0; --shadow: 0 4px 15px rgba(0,0,0,0.08); }
        [data-theme="dark"] { --bg: #0f1724; --card: #1a2332; --text: #e8eef7; --text-muted: #8a9bb4; --primary: #4a7fd4; --primary-2: #5b8ee6; --border: #2a3a52; --shadow: 0 4px 15px rgba(0,0,0,0.4); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; transition: background 0.3s, color 0.3s; }
        nav { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; }
        nav a { padding: 10px 18px; background: var(--card); color: var(--text); border-radius: 25px; text-decoration: none; font-weight: 600; font-size: 0.9rem; box-shadow: var(--shadow); border: 2px solid transparent; transition: all 0.3s; }
        nav a:hover { border-color: var(--primary-2); }
        nav a.active-nav { background: var(--primary); color: white; }
        nav button { padding: 10px 14px; background: var(--card); border: 2px solid var(--border); border-radius: 25px; cursor: pointer; font-size: 1rem; color: var(--text); }
        .container { max-width: 950px; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 25px; box-shadow: var(--shadow); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }
        .chart-card { background: var(--bg); border-radius: 15px; padding: 20px; }
        .chart-card h3 { color: var(--primary); margin-bottom: 15px; font-size: 1rem; text-align: center; }
        .chart-wrap { position: relative; height: 320px; }
        .info-box { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; border-radius: 12px; padding: 15px; margin-top: 20px; text-align: center; }
        .info-box .big { font-size: 1.8rem; font-weight: bold; }
        .info-box .lbl { font-size: 0.85rem; opacity: 0.85; }
    </style>
</head>
<body>

<nav>
    <a href="index.html">🏠 হোম</a>
    <a href="chart.html">📊 চার্ট</a>
    <a href="report.html">📆 রিপোর্ট</a>
    <button id="themeToggle" onclick="toggleTheme()">🌙</button>
    <button onclick="logout()">🚪 লগআউট</button>
</nav>

<div class="container">
    <h1>📊 চার্ট ও গ্রাফ</h1>
    <p class="subtitle">আপনার খরচের ভিজ্যুয়াল বিশ্লেষণ</p>
    <div class="chart-grid">
        <div class="chart-card">
            <h3>🥧 ক্যাটাগরি অনুযায়ী ব্যয়</h3>
            <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
        </div>
        <div class="chart-card">
            <h3>📊 ক্যাটাগরি অনুযায়ী ব্যয় (বার)</h3>
            <div class="chart-wrap"><canvas id="barChart"></canvas></div>
        </div>
    </div>
    <div class="chart-card" style="margin-top: 20px;">
        <h3>📈 শেষ ১৪ দিনের আয় vs ব্যয়</h3>
        <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
    </div>
    <div class="info-box">
        <div class="lbl">মোট ব্যয়</div>
        <div class="big" id="totalExp">৳ ০</div>
    </div>
</div>

<script src="common.js"></script>
<script>
(async () => {
    const user = await requireAuth();
    if (!user) return;

    const { data } = await supabaseClient.from('transactions').select('*');
    const transactions = data || [];
    const theme = localStorage.getItem(THEME_KEY) || 'light';
    const textColor = theme === 'dark' ? '#e8eef7' : '#333';

    const expenses = transactions.filter(t => t.type === 'expense');
    const totalExp = expenses.reduce((s, t) => s + Number(t.amount), 0);
    document.getElementById('totalExp').textContent = formatBDT(totalExp);

    const catMap = {};
    expenses.forEach(t => { catMap[t.category] = (catMap[t.category] || 0) + Number(t.amount); });
    const labels = Object.keys(catMap);
    const values = Object.values(catMap);
    const palette = ['#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#34495e'];

    if (labels.length) {
        new Chart(document.getElementById('pieChart'), {
            type: 'doughnut',
            data: { labels, datasets: [{ data: values, backgroundColor: palette, borderColor: theme === 'dark' ? '#1a2332' : '#fff', borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: textColor } }, tooltip: { callbacks: { label: c => `${c.label}: ${formatBDT(c.parsed)}` } } } }
        });
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: { labels, datasets: [{ label: 'ব্যয়', data: values, backgroundColor: palette, borderRadius: 8 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => formatBDT(c.parsed.y) } } }, scales: { x: { ticks: { color: textColor } }, y: { beginAtZero: true, ticks: { color: textColor } } } }
        });
    }

    const days = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toISOString().split('T')[0]); }
    const incArr = days.map(d => transactions.filter(t => t.date === d && t.type === 'income').reduce((s, t) => s + Number(t.amount), 0));
    const expArr = days.map(d => transactions.filter(t => t.date === d && t.type === 'expense').reduce((s, t) => s + Number(t.amount), 0));

    new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: { labels: days.map(d => d.slice(5)), datasets: [
            { label: 'আয়', data: incArr, borderColor: '#2ecc71', backgroundColor: 'rgba(46,204,113,0.15)', tension: 0.4, fill: true },
            { label: 'ব্যয়', data: expArr, borderColor: '#e74c3c', backgroundColor: 'rgba(231,76,60,0.15)', tension: 0.4, fill: true }
        ]},
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor } }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${formatBDT(c.parsed.y)}` } } }, scales: { x: { ticks: { color: textColor } }, y: { beginAtZero: true, ticks: { color: textColor } } } }
    });
})();
</script>

</body>
</html>
